# Windows installer (spec 13 / 19): `npm run dist:win` on a Windows machine.
appId: app.livingrepository.desktop
productName: Living Repository
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: LivingRepository-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Living Repository
# Auto-update check (spec 19.1): configure a publish provider here when releases exist, e.g.
# publish:
#   provider: github
#   owner: <owner>
#   repo: <repo>
