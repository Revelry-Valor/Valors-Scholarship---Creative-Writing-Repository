# Windows installer and automatic updates.
# Built by GitHub Actions (.github/workflows/release.yml) and published to GitHub Releases;
# installed copies check there for new versions. To build locally on Windows: npm run dist:win
appId: app.livingrepository.desktop
productName: Living Repository
copyright: Copyright © Revelry Valor
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: LivingRepository-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Living Repository
  # Uninstalling never deletes your projects (they live in your Documents folder).
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: Revelry-Valor
  repo: Valors-Scholarship---Creative-Writing-Repository
  releaseType: release
